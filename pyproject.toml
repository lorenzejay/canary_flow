[project]
name = "canary_flow"
version = "0.1.0"
description = "canary_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.15.23",
    "exa-py>=2.0.0",
    "langchain-mcp-adapters>=0.2.2",
]

[project.scripts]
kickoff = "canary_flow.main:kickoff"
run_crew = "canary_flow.main:kickoff"
plot = "canary_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "7e16b087-68e6-462c-bc23-ca2662cbb602"

